<app-header-component></app-header-component>
<app-sidebar-component></app-sidebar-component>
<div class="projects-layout">
  <main class="main-content">
    <div class="projects-container">
      <!-- Header Section -->
      <div class="projects-header">
        <div class="header-content">
          <h1 class="projects-title">Projects</h1>
          <p class="projects-subtitle">Manage and track your projects</p>
        </div>
        <button
          mat-raised-button
          color="primary"
          class="create-button"
          (click)="onCreateProject()"
        >
          Create New Project
        </button>
      </div>

      <!-- No Projects Found Section -->
      <ng-template #noProjects>
        <div class="no-projects-section">
          <div class="folder-icon">📁</div>
          <h2 class="no-projects-title">No Projects Found</h2>
          <p class="no-projects-description">
            You haven't created any projects yet. Start by creating your first
            project to begin managing your work.
          </p>
          <button
            mat-raised-button
            color="primary"
            class="create-first-button"
            (click)="onCreateProject()"
          >
            Create Your First Project
          </button>
        </div>
      </ng-template>
    </div>
    <!------------------Start Table-------------------->
    <app-project-list
      *ngIf="parentProjectList.length > 0; else noProjects"
      [childProjectList]="parentProjectList"
    >
    </app-project-list>
    <!------------------End Table--------------------->
    <!-- <app-project-details
    ngIf=""
    ></app-project-details> -->
  </main>
</div>
