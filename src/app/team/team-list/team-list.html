<app-header-component></app-header-component>
<app-sidebar-component></app-sidebar-component>
<div class="project-create-layout">
  <main class="main-content">
    <div class="team-list-container">
      <!-- Header Section -->
      <div class="project-create-header">
        <div class="team-list-container">
          <div class="team-list-header">
            <div class="header-content">
              <h1 class="team-list-title">Team Members</h1>
              <p class="team-list-subtitle">
                Manage and track your team members
              </p>
            </div>
            <button
              mat-raised-button
              color="primary"
              class="add-team-member-button"
              (click)="onAddTeamMember()"
            >
              Add Team Member
            </button>
          </div>

          <ng-template #noTeamMembers>
            <div class="no-team-members-section">
              <div class="folder-icon">📁</div>
              <h2 class="no-team-members-title">No Team Members Found</h2>
              <p class="no-team-members-description">
                You haven't created any team members yet. Start by creating your
                first team member to begin managing team.
              </p>
              <button
                mat-raised-button
                color="primary"
                class="create-first-button"
                (click)="onAddTeamMember()"
              >
                Create Your First Team Member
              </button>
            </div>
          </ng-template>

          <div
            *ngIf="teamMembers.length > 0; else noTeamMembers"
            class="team-list-table"
          >
            <table
              mat-table
              [dataSource]="dataSource"
              matSort
              (matSortChange)="announceSortChange($event)"
              class="mat-elevation-z8"
            >
              <ng-container matColumnDef="name">
                <th
                  mat-header-cell
                  *matHeaderCellDef
                  mat-sort-header
                  sortActionDescription="Sort by name"
                >
                  Name
                </th>
                <td mat-cell *matCellDef="let element">{{ element.name }}</td>
              </ng-container>

              <ng-container matColumnDef="email">
                <th
                  mat-header-cell
                  *matHeaderCellDef
                  mat-sort-header
                  sortActionDescription="Sort by email"
                >
                  Email
                </th>
                <td mat-cell *matCellDef="let element">{{ element.email }}</td>
              </ng-container>

              <ng-container matColumnDef="role">
                <th
                  mat-header-cell
                  *matHeaderCellDef
                  mat-sort-header
                  sortActionDescription="Sort by role"
                >
                  Role
                </th>
                <td mat-cell *matCellDef="let element">{{ element.role }}</td>
              </ng-container>

              <tr
                mat-header-row
                *matHeaderRowDef="displayedColumns"
                class="header-row"
              ></tr>
              <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
